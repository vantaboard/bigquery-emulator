version: "3"

tasks:
  install:
    desc: Install npm dependencies for the VSCode extension workspace
    dir: extensions/vscode
    cmds:
      - npm install

  build:
    desc: Build the VSCode extension client, server, and shared packages
    dir: extensions/vscode
    deps:
      - install
    cmds:
      - npm run build --workspace=@bigquery-emulator/vscode-shared
      - npm run build --workspace=@bigquery-emulator/vscode-server
      - npm run build --workspace=bigquery-emulator

  test:
    desc: Run VSCode extension unit and parity tests
    dir: extensions/vscode
    deps:
      - build
    cmds:
      - npm run test --workspace=@bigquery-emulator/vscode-shared
      - npm run test --workspace=@bigquery-emulator/vscode-server
      - npm run test --workspace=@bigquery-emulator/vscode-test

  lint:
    desc: Typecheck the VSCode extension workspace
    dir: extensions/vscode
    deps:
      - install
    cmds:
      - npm run lint --workspace=@bigquery-emulator/vscode-shared
      - npm run lint --workspace=@bigquery-emulator/vscode-server
      - npm run lint --workspace=bigquery-emulator
