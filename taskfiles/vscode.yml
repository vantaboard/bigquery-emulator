version: "3"

tasks:
  install:
    desc: Install pnpm dependencies for the VSCode extension workspace
    cmds:
      - pnpm install

  build:
    desc: Build the VSCode extension client, server, and shared packages
    deps:
      - install
    cmds:
      - pnpm --filter @bigquery-emulator/vscode-shared build
      - pnpm --filter @bigquery-emulator/vscode-server build
      - pnpm --filter bigquery-emulator build

  test:
    desc: Run VSCode extension unit and parity tests
    deps:
      - build
    cmds:
      - pnpm --filter @bigquery-emulator/vscode-shared test
      - pnpm --filter @bigquery-emulator/vscode-server test
      - pnpm --filter @bigquery-emulator/vscode-test test

  lint:
    desc: Typecheck the VSCode extension workspace
    deps:
      - install
    cmds:
      - pnpm --filter @bigquery-emulator/vscode-shared lint
      - pnpm --filter @bigquery-emulator/vscode-server lint
      - pnpm --filter bigquery-emulator lint
