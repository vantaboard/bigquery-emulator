server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # BigQuery REST API (projects, datasets, tables, queries).
    # Resolve upstream at request time so nginx starts even if the emulator
    # container is not on the Docker network yet (127.0.0.11 = Docker DNS).
    location /bigquery/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bq_backend bigquery:9050;
        proxy_pass http://$bq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Emulator SQL Tools API (format/parse/complete). Requires bigquery-emulator
    # release with --enable-sql-tools-api and --sql-tools-api-allow-remote in Compose.
    location /api/emulator/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bq_backend bigquery:9050;
        proxy_pass http://$bq_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
