# Use with the base file so the UI talks to the Vantaboard fork (multi-project + /emulator/v1/*).
# Example:
#   docker compose -f docker-compose.yaml -f docker-compose.local.yaml up
#
# To build the emulator from a local sibling checkout instead, replace the `image` line with:
#   build:
#     context: ../googlesql_workspace/bigquery-emulator
#     dockerfile: Dockerfile.linked
#   (requires sibling go-googlesql / go-googlesql trees as documented in that repo.)
version: "3.7"
services:
  bigquery:
    image: ghcr.io/vantaboard/bigquery-emulator:latest
