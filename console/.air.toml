# Live reload: install Air, then run `air` from the repo root.
#   go install github.com/air-verse/air@latest
#
# Loads optional `.env` (same as the binary). Rebuilds on Go or static asset changes.

root = "."
tmp_dir = "tmp/air"
env_files = [".env"]

[build]
cmd = "go build -o ./tmp/air/bq-ui ."
bin = "./tmp/air/bq-ui"
include_ext = ["go", "mod", "sum", "html", "js", "css"]
exclude_dir = ["tmp", "vendor", ".git", "data", ".github"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = false
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"
log = "air.log"

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[screen]
clear_on_rebuild = true
keep_scroll = true
