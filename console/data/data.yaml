project_id: local-project
datasets:
  - id: test-dataset
    tables:
      - id: table_a
        schema:
          - { name: id, type: INT64, mode: REQUIRED }
          - { name: name, type: STRING, mode: REQUIRED }
          - name: structarr
            type: STRUCT
            mode: REPEATED
            fields:
              - { name: key, type: STRING }
              - { name: value, type: JSON }
          - { name: birthday, type: DATE }
          - { name: skillNum, type: NUMERIC }
          - { name: created_at, type: TIMESTAMP }
        rows:
          - id: 1
            name: alice
            structarr:
              - key: profile
                value: '{"age": 10}'
            birthday: "2012-01-01"
            skillNum: 3
            created_at: "2022-01-01T12:00:00"
          - id: 2
            name: bob
            structarr:
              - key: profile
                value: '{"age": 15}'
            birthday: "2007-02-01"
            skillNum: 5
            created_at: "2022-01-02T18:00:00"
  - id: events_dataset
    tables:
      - id: user_events
        schema:
          - { name: event_id, type: STRING, mode: REQUIRED }
          - { name: user_id, type: INT64, mode: REQUIRED }
          - { name: event_type, type: STRING }
          - { name: metadata, type: JSON }
          - { name: event_timestamp, type: TIMESTAMP }
        rows:
          - event_id: "evt_001"
            user_id: 123
            event_type: "page_view"
            metadata: '{"page": "/home", "device": "mobile"}'
            event_timestamp: "2023-01-01T10:30:00"
          - event_id: "evt_002"
            user_id: 456
            event_type: "purchase"
            metadata: '{"amount": 99.99, "product_id": "prod_123"}'
            event_timestamp: "2023-01-02T15:45:00"
  - id: products_dataset
    tables:
      - id: inventory
        schema:
          - { name: product_id, type: STRING, mode: REQUIRED }
          - { name: name, type: STRING }
          - { name: price, type: FLOAT64 }
          - { name: categories, type: STRING, mode: REPEATED }
          - name: specs
            type: STRUCT
            fields:
              - { name: weight, type: FLOAT64 }
              - { name: dimensions, type: STRING }
              - { name: color, type: STRING }
        rows:
          - product_id: "P001"
            name: "Ergonomic Chair"
            price: 299.99
            categories: ["furniture", "office"]
            specs:
              weight: 12.5
              dimensions: "60x55x115cm"
              color: "black"
          - product_id: "P002"
            name: "Standing Desk"
            price: 499.99
            categories: ["furniture", "office", "premium"]
            specs:
              weight: 35.0
              dimensions: "120x60x75cm"
              color: "oak"
  - id: sales_dataset
    tables:
      - id: transactions
        schema:
          - { name: transaction_id, type: STRING, mode: REQUIRED }
          - { name: customer_id, type: INT64 }
          - { name: total_amount, type: NUMERIC }
          - { name: purchase_date, type: TIMESTAMP }
        rows:
          - transaction_id: "T001"
            customer_id: 1001
            total_amount: 1099.97
            purchase_date: "2023-03-15T14:30:00"
