# E2E stack: pinned Vantaboard emulator + static UI (nginx proxies /bigquery to emulator).
# Expects `console/dist` from `pnpm --filter @bigquery-emulator/console build`
# (CI runs build before e2e:up; locally `e2e:up` builds first).
# Usage: pnpm run e2e:up
services:
  bigquery:
    image: ghcr.io/vantaboard/bigquery-emulator:v0.9.0
    platform: linux/x86_64
    volumes:
      - ./e2e/fixtures/seed.yaml:/data/seed.yaml:ro
    command: ["--project-id=local-project", "--seed-data-file=/data/seed.yaml", "--sql-tools-api-allow-remote"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9050/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  bq-ui:
    image: nginx:1.27-alpine
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      bigquery:
        condition: service_healthy
