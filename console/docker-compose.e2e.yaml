# E2E stack: pinned Vantaboard emulator + static UI (nginx proxies /bigquery to emulator).
# Usage: docker compose -f docker-compose.e2e.yaml up -d --wait --build
services:
  bigquery:
    image: ghcr.io/vantaboard/bigquery-emulator:v0.3.1
    platform: linux/x86_64
    volumes:
      - ./e2e/fixtures/seed.yaml:/data/seed.yaml:ro
    command: ["--project-id=local-project", "--seed-data-file=/data/seed.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9050/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  bq-ui:
    build:
      context: .
      args:
        VITE_DEFAULT_PROJECT: local-project
    ports:
      - "8080:80"
    depends_on:
      bigquery:
        condition: service_healthy
