version: '3.7'
services:
  bigquery:
    platform: linux/x86_64
    image: ghcr.io/goccy/bigquery-emulator:latest
    ports:
      - "9050:9050"
      - "9060:9060"
    volumes:
      - ./data:/data
    command: --project=local-project --data-from-yaml=/data/data.yaml

  # Static UI + nginx. Proxies /bigquery to the emulator on port 9050.
  bq-ui:
    build:
      context: .
      args:
        VITE_DEFAULT_PROJECT: local-project
    ports:
      - "8080:80"
    depends_on:
      - bigquery
