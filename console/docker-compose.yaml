services:
  bigquery:
    image: ghcr.io/vantaboard/bigquery-emulator:v0.3.1
    platform: linux/x86_64
    ports:
      - "9050:9050"
    volumes:
      - ./data/data.yaml:/data/seed.yaml:ro
    command: ["--project-id=local-project", "--seed-data-file=/data/seed.yaml"]
    # When using an emulator release with SQL Tools API, add:
    #   "--enable-sql-tools-api", "--sql-tools-api-allow-remote"
    # (--sql-tools-api-allow-remote is required in Compose: nginx is not loopback.)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9050/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  bq-ui:
    build:
      context: .
      args:
        VITE_DEFAULT_PROJECT: local-project
    ports:
      - "8080:80"
    depends_on:
      bigquery:
        condition: service_healthy
