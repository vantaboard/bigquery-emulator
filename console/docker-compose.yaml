version: '3.7'
services:
  bigquery:
    platform: linux/x86_64
    image: ghcr.io/goccy/bigquery-emulator:latest
    ports:
      - "9050:9050"
      - "9060:9060"
    volumes:
      - ./data:/data
    command: --project=local-project --data-from-yaml=/data/data.yaml

  # Static UI + nginx. Proxies /api to the explorer API on the host (port 8000).
  # Start the API separately from the bigquery-emulator repo:
  #   cd ../bigquery-emulator && BIGQUERY_EMULATOR_HOST=localhost:9050 go run ./cmd/bq-explorer-api
  bq-ui:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - bigquery
