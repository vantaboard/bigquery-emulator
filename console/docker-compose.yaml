services:
  bigquery:
    image: ghcr.io/vantaboard/bigquery-emulator:v0.9.0
    platform: linux/x86_64
    ports:
      - "9050:9050"
    volumes:
      - ./data/data.yaml:/data/seed.yaml:ro
    command: ["--project-id=local-project", "--seed-data-file=/data/seed.yaml", "--sql-tools-api-allow-remote"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9050/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  bq-ui:
    build:
      context: ..
      dockerfile: console/Dockerfile
      args:
        VITE_DEFAULT_PROJECT: local-project
    ports:
      - "8080:80"
    depends_on:
      bigquery:
        condition: service_healthy
