# Local dev tasks for bigquery-emulator-ui.
# Primary workflow: native emulator from a sibling checkout + Vite dev server.
# See README.md → "Develop against a local emulator build".
version: "3"

vars:
  UI_ROOT:
    sh: git rev-parse --show-toplevel 2>/dev/null || pwd
  EMULATOR_ROOT:
    sh: |
      root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
      emu="${EMULATOR_ROOT:-$root/../bigquery-emulator}"
      cd "$root" && cd "$emu" && pwd
  EMULATOR_HTTP_PORT:
    sh: echo "${EMULATOR_HTTP_PORT:-9050}"
  EMULATOR_GRPC_PORT:
    sh: echo "${EMULATOR_GRPC_PORT:-9060}"
  PROJECT_ID:
    sh: echo "${PROJECT_ID:-local-project}"
  SEED_FILE:
    sh: |
      root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
      if [ -n "${SEED_FILE:-}" ]; then
        echo "${SEED_FILE}"
      else
        echo "$root/data/data.yaml"
      fi

tasks:
  default:
    desc: List every available task
    cmds:
      - task --list
    silent: true

  emulator:check:
    desc: Verify the sibling bigquery-emulator checkout is built
    cmds:
      - |
        set -eo pipefail
        emu="{{.EMULATOR_ROOT}}"
        if [ ! -d "$emu" ]; then
          echo "EMULATOR_ROOT not found: $emu" >&2
          echo "Clone bigquery-emulator as a sibling or set EMULATOR_ROOT." >&2
          exit 1
        fi
        if [ ! -x "$emu/bin/gateway_main" ] || [ ! -x "$emu/bin/emulator_main" ]; then
          echo "Emulator binaries missing under $emu/bin/" >&2
          echo "Run once: task emulator:build" >&2
          exit 1
        fi
        echo "ok: $emu"

  emulator:build:
    desc: Build gateway + engine in the sibling bigquery-emulator checkout
    cmds:
      - |
        set -eo pipefail
        task -d "{{.EMULATOR_ROOT}}" emulator:build-all

  emulator:run:
    desc: Run a locally built emulator with UI seed data and SQL Tools enabled
    deps: [emulator:check]
    cmds:
      - |
        set -eo pipefail
        emu="{{.EMULATOR_ROOT}}"
        seed="{{.SEED_FILE}}"
        if [ -f "$seed" ]; then
          seed="$(cd "$(dirname "$seed")" && pwd)/$(basename "$seed")"
        fi
        if [ ! -f "$seed" ]; then
          echo "seed file not found: $seed" >&2
          exit 1
        fi
        cd "$emu"
        exec ./bin/gateway_main \
          --engine-binary=./bin/emulator_main \
          --http-port={{.EMULATOR_HTTP_PORT}} \
          --grpc-port={{.EMULATOR_GRPC_PORT}} \
          --project-id={{.PROJECT_ID}} \
          --seed-data-file="$seed" \
          --enable-sql-tools-api \
          --sql-tools-api-allow-remote \
          --log-requests

  dev:
    desc: Vite dev server (expects emulator on EMULATOR_HTTP_PORT)
    dir: "{{.UI_ROOT}}"
    cmds:
      - npm run dev

  dev:all:
    desc: Start local emulator in the background, wait for health, then Vite
    deps: [emulator:check]
    dir: "{{.UI_ROOT}}"
    cmds:
      - bash scripts/dev-all.sh

  e2e:local:
    desc: Run Playwright against a native emulator + Vite (not the pinned GHCR image)
    deps: [emulator:check]
    dir: "{{.UI_ROOT}}"
    cmds:
      - bash scripts/e2e-local.sh {{.CLI_ARGS}}
