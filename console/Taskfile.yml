# Prefer root tasks: `task console:*` from the monorepo root.
# This file remains so `task` inside console/ still lists a pointer.
version: "3"

tasks:
  default:
    desc: Point at monorepo console tasks
    cmds:
      - |
        echo "Run console tasks from the monorepo root:"
        echo "  task console:dev:all"
        echo "  task console:build"
        echo "  task console:test"
        echo "  task console:e2e:local"
    silent: true
