# R15: RANK / DENSE_RANK over nested aggregate (ties)
# Follow-up to R14 NTILE semantic analytic gap.
# Index: conformance/REGRESSIONS.md
#
# Nested SUM inside the OVER ORDER BY promotes the query to
# `semantic_executor` (`ResolvedAnalyticFunctionCall(nested_aggregate)`).
# Pins Olympic RANK gaps vs DENSE_RANK with intentional peer ties.
name: rank_dense_rank_over_aggregate_input
description: |
  RANK and DENSE_RANK over ORDER BY SUM(amount) with tied group
  totals — semantic executor path.
project_id: proj-r15-rank-agg
query: |
  SELECT
    customer_id,
    RANK() OVER (ORDER BY SUM(amount) DESC) AS rnk,
    DENSE_RANK() OVER (ORDER BY SUM(amount) DESC) AS drnk
  FROM (
    SELECT 1 AS customer_id, 100 AS amount UNION ALL
    SELECT 1, 50 UNION ALL
    SELECT 2, 100 UNION ALL
    SELECT 2, 50 UNION ALL
    SELECT 3, 200 UNION ALL
    SELECT 4, 50
  )
  GROUP BY customer_id
  ORDER BY customer_id
expected:
  route: semantic_executor
  rows:
    - {customer_id: "1", rnk: "2", drnk: "2"}
    - {customer_id: "2", rnk: "2", drnk: "2"}
    - {customer_id: "3", rnk: "1", drnk: "1"}
    - {customer_id: "4", rnk: "4", drnk: "3"}
