# R13: correlated UNNEST in CTE (no GROUP BY) + outer LEFT JOIN
# Reported: tester email (v0.8.0 Docker) — sibling of
# unnest_groupby_cte_then_join.yaml (same state-leak family).
# Index: conformance/REGRESSIONS.md
name: unnest_cte_then_join
description: |
  CTE with correlated UNNEST (no aggregation); outer LEFT JOIN on
  the unnested value. Pins CTE-anchor projection and outer join
  sides against stale `__bq_j_<id>` aliases.
project_id: proj-r13-unnest-cte-join-nogroup
dataset_id: ds_repro2
setup:
  - dataset: ds_repro2
  - table:
      dataset: ds_repro2
      id: products
      schema:
        - {name: id, type: INT64, mode: REQUIRED}
        - {name: is_published, type: BOOL, mode: NULLABLE}
        - {name: collection_ids, type: INT64, mode: REPEATED}
  - table:
      dataset: ds_repro2
      id: collections
      schema:
        - {name: id, type: INT64, mode: REQUIRED}
        - {name: title, type: STRING, mode: NULLABLE}
        - {name: is_published, type: BOOL, mode: NULLABLE}
        - {name: products_count, type: INT64, mode: NULLABLE}
  - rows:
      dataset: ds_repro2
      table: products
      rows:
        - {id: 1, is_published: true, collection_ids: [10, 20]}
  - rows:
      dataset: ds_repro2
      table: collections
      rows:
        - {id: 10, title: summer, is_published: true, products_count: 2}
query: |
  WITH product_collections AS (
      SELECT p.id AS product_id, col_id
      FROM ds_repro2.products p,
      UNNEST(p.collection_ids) AS col_id
  )
  SELECT
      c.id AS collection_id,
      c.title AS collection_title,
      pc.product_id AS product_id
  FROM ds_repro2.collections c
  LEFT JOIN product_collections pc ON c.id = pc.col_id
expected:
  rows:
    - {collection_id: "10", collection_title: summer, product_id: "1"}
